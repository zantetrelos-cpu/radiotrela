<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #66ff33;
    --pink-light: #ff66dd;
  }

  body {
    margin: 0;
    font-family: Segoe UI, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    background: 100% 100%;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,255,204,0.5) rgba(0,0,0,0.1);
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(0,255,204,0.6), rgba(0,255,204,0.3));
    border-radius: 10px;
    box-shadow: 0 0 6px rgba(0,255,204,0.6);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(0,255,204,0.9), rgba(0,255,204,0.5));
    box-shadow: 0 0 10px rgba(0,255,204,0.9);
  }

  #loadingModal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.9);
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  .modal-content {
    background: rgba(20, 20, 20, 0.9);
    padding: 30px;
    border: 2px solid #00ffcc;
    border-radius: 15px;
    color: #00ffcc;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 0 30px #00ffcc;
    animation: pulse 1.5s infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(0, 255, 204, 0.1);
    border-top: 4px solid #00ffcc;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .player-btn {
    width:180px;height:180px;border-radius:50%;
    background: rgba(0, 0, 0, 0.0) url('logo.png') center/cover no-repeat;
    color:#00ffcc;font-size:20px;display:flex;align-items:flex-end;justify-content:center;
    position:absolute;top:40px;z-index:5;
    transition:transform .12s linear;
    text-shadow:0 0 8px #00ffcc;font-weight:bold;padding-bottom:10px;
    --glow-h: 174;
    --glow-size: 20px;
    border: 4px solid hsl(var(--glow-h), 100%, 50%);
    box-shadow: 0 0 var(--glow-size) hsla(var(--glow-h), 100%, 50%, 0.8),
                0 0 calc(var(--glow-size) / 2) hsla(var(--glow-h), 100%, 70%, 1);
  }
  #playBtn {
    position: absolute; top: 20px; right: 20px;
    width: 100px; height: 45px; border-radius: 8px;
    border: 2px solid #00ffcc; background: rgba(0, 0, 0, 0.5);
    color: #00ffcc; cursor: pointer; font-weight: bold; z-index: 100;
    box-shadow: 0 0 15px #00ffcc; display: flex; align-items: center; justify-content: center;
  }
  #status{position:absolute;top:270px;font-weight:700;letter-spacing:1px;font-size:30px; z-index:6;}
  .onair{color:#00ff99;text-shadow:0 0 10px #00ff99}
  .offair{color:#ff6600;text-shadow:0 0 12px #ff6600}
  .loading{color:#ffaa00;text-shadow:0 0 10px #ffaa00}

  #equalizer{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  #nowPlaying {
    position: absolute;
    top: 390px;
    width: 90%;
    height: 50px;
    z-index: 4;
    overflow: hidden;
    white-space: nowrap;
    font-family: 'Montserrat', sans-serif;
    font-size: 29px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px #ff0000;
    display: flex;
    align-items: center;
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
  }
  .scroll-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 15s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }
  .static-text {
    display: inline-block;
    width: 100%;
    text-align: center;
    animation: floatTitle 3s ease-in-out infinite alternate;
  }
  @keyframes floatTitle {
    from { transform: translateY(0px); opacity: 0.9; }
    to { transform: translateY(-5px); opacity: 1; }
  }
  #volumeControl {
    position: absolute;top: 330px;left: 50%;transform: translateX(-50%);
    display: flex;align-items: center;gap: 10px;z-index: 5;
  }
  #volumeSlider {width: 250px;height: 5px;appearance: none;background: #333;border-radius: 5px;outline: none;box-shadow: 0 0 10px #00ffcc;}
  #volumeSlider::-webkit-slider-thumb {appearance: none;width: 18px;height: 18px;border-radius: 50%;background: #00ffcc;cursor: pointer;box-shadow: 0 0 10px #00ffcc;}
  #volumeValue {font-size: 18px;color: #00ffcc;text-shadow: 0 0 8px #00ffcc;width: 50px;text-align: left;}
  #effectBtn {
    position: absolute; top: 20px; left: 20px;
    width: 100px; height: 45px; border-radius: 8px;
    border: 2px solid #00ffcc; background: rgba(0, 0, 0, 0.5);
    color: #00ffcc; cursor: pointer; font-weight: bold; z-index: 100;
    box-shadow: 0 0 15px #00ffcc; display: flex; align-items: center; justify-content: center;
  }
  body::after {content: "";position: fixed;top: 0;left: 0;width: 100%;height: 100%;background-color: rgba(0, 0, 0, 0.5);z-index: -1;}

  /* Κρύβει τον player όσο τρέχει το intro */
  .player-hidden {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* ========== FANCY INTRO ========== */
  #startOverlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 42%, rgba(255, 51, 204, 0.18) 0%, rgba(142, 45, 180, 0.14) 22%, rgba(34, 12, 52, 0.82) 52%, #09050f 100%);
    z-index: 100000;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    visibility: visible;
    transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #startOverlay::before {
    content: "";
    position: absolute;
    inset: -25%;
    background:
      radial-gradient(ellipse at 18% 25%, rgba(255, 51, 204, 0.17), transparent 35%),
      radial-gradient(ellipse at 82% 18%, rgba(112, 72, 255, 0.14), transparent 34%),
      radial-gradient(ellipse at 78% 82%, rgba(255, 0, 153, 0.11), transparent 36%),
      radial-gradient(ellipse at 15% 85%, rgba(74, 25, 155, 0.13), transparent 38%);
    filter: blur(55px);
    animation: ambientMove 18s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes ambientMove {
    0% { transform: translate3d(-2%, -2%, 0) scale(1); }
    50% { transform: translate3d(3%, 2%, 0) scale(1.05); }
    100% { transform: translate3d(-1%, 4%, 0) scale(1.02); }
  }
  #startOverlay::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0%, rgba(8, 3, 15, 0.08) 42%, rgba(4, 1, 9, 0.50) 100%);
    box-shadow: inset 0 0 180px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  #startOverlay.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .intro-glow {
    position: absolute;
    width: 620px;
    height: 620px;
    background: radial-gradient(circle, rgba(255, 51, 204, 0.18) 0%, rgba(184, 45, 220, 0.10) 28%, rgba(105, 40, 180, 0.04) 52%, transparent 72%);
    border-radius: 50%;
    filter: blur(42px);
    animation: introGlow 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes introGlow {
    0%, 100% { transform: scale(0.90) translateY(0); opacity: 0.55; }
    50% { transform: scale(1.10) translateY(-14px); opacity: 0.95; }
  }
  .intro-content {
    position: relative;
    z-index: 5;
    width: min(90%, 520px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-family: 'Unica One', Arial, sans-serif;
    --intro-scale: 1;
    transform: scale(var(--intro-scale));
    transform-origin: center center;
    animation: introAppear 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes introAppear {
    from { opacity: 0; transform: scale(calc(var(--intro-scale) * 0.94)) translateY(24px); }
    to { opacity: 1; transform: scale(var(--intro-scale)) translateY(0); }
  }
  .intro-logo-wrapper {
    position: relative;
    width: 330px;
    height: 330px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 60px;
  }
  .intro-logo-wrapper::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 40px rgba(255, 51, 204, 0.08);
  }
  .intro-logo-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 1px solid rgba(255, 51, 204, 0.32);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(255, 51, 204, 0.06);
    animation: logoRing 10s linear infinite;
  }
  .intro-logo-ring::before {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    background: var(--pink);
    border-radius: 50%;
    top: -3.5px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 8px var(--pink), 0 0 20px var(--pink), 0 0 38px rgba(255, 51, 204, 0.55);
  }
  @keyframes logoRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .intro-logo {
    position: relative;
    width: 300px;
    height: 300px;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.40)) drop-shadow(0 0 35px rgba(153, 255, 102, 0.12));
    animation: logoFloat 5s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.015); }
  }
  .intro-station {
    position: relative;
    color: #99ff66;
    font-size: 36px;
    line-height: 1;
    letter-spacing: 7px;
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-left: 7px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.18), 0 0 28px rgba(255, 51, 204, 0.22);
  }
  .intro-station::after {
    content: "";
    position: absolute;
    width: 55px;
    height: 1px;
    left: 50%;
    bottom: -9px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(255, 51, 204, 0.75), transparent);
    box-shadow: 0 0 10px rgba(255, 51, 204, 0.35);
  }
  .intro-live {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: rgba(255, 255, 255, 0.70);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
    margin-bottom: 38px;
    padding: 7px 14px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.025);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(8px);
  }
  .intro-live-dot {
    width: 6px;
    height: 6px;
    background: var(--pink);
    border-radius: 50%;
    box-shadow: 0 0 7px var(--pink), 0 0 16px var(--pink);
    animation: livePulse 1.5s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.65); }
  }
  .intro-equalizer {
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-bottom: 34px;
    padding: 0 18px;
  }
  .eq-bar {
    width: 3px;
    background: linear-gradient(to top, rgba(255, 51, 204, 0.55), rgba(255, 102, 221, 1));
    border-radius: 10px;
    box-shadow: 0 0 8px rgba(255, 51, 204, 0.35);
    animation: equalizer 1s ease-in-out infinite;
  }
  .eq-bar:nth-child(1) { height: 14px; animation-delay: 0.10s; }
  .eq-bar:nth-child(2) { height: 27px; animation-delay: 0.25s; }
  .eq-bar:nth-child(3) { height: 38px; animation-delay: 0.05s; }
  .eq-bar:nth-child(4) { height: 22px; animation-delay: 0.35s; }
  .eq-bar:nth-child(5) { height: 34px; animation-delay: 0.15s; }
  .eq-bar:nth-child(6) { height: 18px; animation-delay: 0.40s; }
  .eq-bar:nth-child(7) { height: 30px; animation-delay: 0.20s; }
  .eq-bar:nth-child(8) { height: 15px; animation-delay: 0.30s; }
  @keyframes equalizer {
    0%, 100% { transform: scaleY(0.35); opacity: 0.35; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  #startBtn {
    position: relative;
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: 1px solid rgba(255, 51, 204, 0.75);
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.10), rgba(255, 51, 204, 0.12) 38%, rgba(255, 51, 204, 0.025) 100%);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    padding-left: 5px;
    box-shadow: 0 0 32px rgba(255, 51, 204, 0.45), 0 0 60px rgba(255, 51, 204, 0.18), inset 0 0 25px rgba(255, 51, 204, 0.08);
    backdrop-filter: blur(10px);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, background 0.35s ease;
  }
  #startBtn::before {
    content: "";
    position: absolute;
    inset: -12px;
    border: 2px solid rgba(255, 51, 204, 0.55);
    border-radius: 50%;
    box-shadow: 0 0 18px rgba(255, 51, 204, 0.40), 0 0 36px rgba(255, 51, 204, 0.18);
    animation: playRing 2.2s ease-out infinite;
  }
  #startBtn::after {
    content: "";
    position: absolute;
    inset: -22px;
    border: 1.5px solid rgba(255, 51, 204, 0.28);
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(255, 51, 204, 0.22);
    animation: playRingOuter 2.2s ease-out infinite;
    animation-delay: 0.85s;
  }
  @keyframes playRing {
    0% { transform: scale(0.82); opacity: 0.95; }
    100% { transform: scale(1.38); opacity: 0; }
  }
  @keyframes playRingOuter {
    0% { transform: scale(0.85); opacity: 0.70; }
    100% { transform: scale(1.32); opacity: 0; }
  }
  #startBtn:hover {
    transform: scale(1.08);
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.16), rgba(255, 51, 204, 0.25) 40%, rgba(255, 51, 204, 0.06) 100%);
    box-shadow: 0 0 35px rgba(255, 51, 204, 0.45), 0 0 70px rgba(255, 51, 204, 0.12), inset 0 0 25px rgba(255, 51, 204, 0.10);
  }
  #startBtn:active { transform: scale(0.96); }
  #introStatus {
    display: none;
    margin-top: 22px;
    color: rgba(255, 255, 255, 0.82);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: statusPulse 1.5s ease-in-out infinite;
  }
  @keyframes statusPulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
  #introProgressWrapper {
    display: none;
    width: min(300px, 75vw);
    margin-top: 20px;
  }
  .intro-progress-track {
    width: 100%;
    height: 2px;
    background: rgba(255, 255, 255, 0.10);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 12px rgba(255, 51, 204, 0.06);
  }
  #introProgress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, rgba(255, 51, 204, 0.65), var(--pink-light));
    box-shadow: 0 0 10px rgba(255, 51, 204, 0.70);
    transition: width 0.15s linear;
  }
  #skipIntroBtn {
    display: none;
    margin-top: 18px;
    padding: 8px 15px;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.55);
    font-family: 'Unica One', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.25s ease, transform 0.25s ease;
    animation: skipPulse 1.6s ease-in-out infinite;
  }
  @keyframes skipPulse {
    0%, 100% { opacity: 0.45; text-shadow: 0 0 0 transparent; transform: translateX(0); }
    50% { opacity: 1; color: rgba(255, 255, 255, 0.95); text-shadow: 0 0 10px rgba(255, 51, 204, 0.55), 0 0 22px rgba(255, 51, 204, 0.30); transform: translateX(2px); }
  }
  #skipIntroBtn:hover {
    color: rgba(255, 255, 255, 0.95);
    transform: translateX(4px);
    animation: none;
    text-shadow: 0 0 12px rgba(255, 51, 204, 0.60);
  }
  .intro-bottom {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    z-index: 5;
    text-align: center;
    color: rgba(255, 255, 255, 0.22);
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: bottomFade 4s ease-in-out infinite;
  }
  @keyframes bottomFade {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 0.85; }
  }
  @media (max-width: 600px) {
    .intro-glow { width: 380px; height: 380px; }
    .intro-logo-wrapper { width: 145px; height: 145px; margin-bottom: 24px; }
    .intro-logo { width: 110px; height: 110px; }
    .intro-station { font-size: 30px; letter-spacing: 3px; }
    .intro-live { font-size: 11px; letter-spacing: 3px; margin-bottom: 28px; }
    .intro-equalizer { margin-bottom: 28px; }
    #startBtn { width: 74px; height: 74px; font-size: 24px; }
    .intro-bottom { bottom: 20px; }
  }
</style>
</head>
<body>

<!-- FANCY INTRO OVERLAY -->
<div id="startOverlay">
  <div class="intro-glow"></div>
  <div class="intro-content">
    <div class="intro-logo-wrapper">
      <div class="intro-logo-ring"></div>
      <img src="intro.png" alt="Radio Live" class="intro-logo">
    </div>
    <div class="intro-station">RADIO Synnefa LIVE </div>
    <div class="intro-live">
      <span class="intro-live-dot"></span>
      LIVE RADIO
    </div>
    <div class="intro-equalizer">
      <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
      <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
    </div>
    <button id="startBtn" aria-label="Play Radio">▶</button>
    <div id="introStatus">INTRO PLAYING</div>
    <div id="introProgressWrapper">
      <div class="intro-progress-track"><div id="introProgress"></div></div>
    </div>
    <button id="skipIntroBtn">SKIP INTRO →</button>
  </div>
  <div class="intro-bottom">TURN UP THE VOLUME • LIVE</div>
</div>

<audio id="introAudio" src="radio spot.mp3" preload="auto"></audio>

<div id="loadingModal">
  <div class="modal-content">
    <div id="modalText">Φόρτωση...</div>
    <div class="spinner"></div>
  </div>
</div>

<canvas id="equalizer" class="player-hidden"></canvas>
<div class="player-btn player-hidden" id="visualizerCircle"></div>
<div id="playBtn" class="player-hidden">Play</div>
<div id="status" class="offair player-hidden">Πάτησε Play</div>
<div id="nowPlaying" class="player-hidden"><span class="static-text">Radio  Live Synnefa</span></div>
<div id="volumeControl" class="player-hidden">
  <input type="range" id="volumeSlider" min="0" max="100" value="100">
  <span id="volumeValue">100%</span>
</div>
<div id="effectBtn" class="player-hidden">Wave</div>

<script>
const STREAMS = {
  live: { name: "ΚΥΡΙΟΣ ΣΕΡΒΕΡ", streamUrl: "https://freestream.hu:8340/trela233", statusUrl: "https://freestream.hu:8340/status-json.xsl?mount=/trela233" },
  backup: { name: "BACKUP ΣΕΡΒΕΡ", streamUrl: "https://radio.nitro-server.uk/listen/radiotrela/radio.mp3", statusUrl: "https://radio.nitro-server.uk/api/nowplaying/radiotrela" }
};
const originalRadioName = "Radio  LIVE";
let audio = new Audio(); audio.crossOrigin = "anonymous";
let audioCtx, analyser, dataArray, bufferLength, sourceNode;
let isPlaying = false, isLive = true, retryIntervalMs = 60000;
let isIntroActive = false, hasIntroPlayed = false;
const btn = document.getElementById('playBtn');
const visualizerCircle = document.getElementById('visualizerCircle');
const statusEl = document.getElementById('status');
const nowPlayingEl = document.getElementById('nowPlaying');
const canvas = document.getElementById('equalizer');
const ctx = canvas.getContext('2d');
const volumeSlider = document.getElementById('volumeSlider');
const volumeValue = document.getElementById('volumeValue');
const effectBtn = document.getElementById('effectBtn');
const loadingModal = document.getElementById('loadingModal');
const modalText = document.getElementById('modalText');

function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setupAudioNodes(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  drawEqualizer();
  startButtonBreath();
}

const effects = [
  (ctx, data, w, h) => {
    const barWidth = (w / bufferLength) * 2.5;
    let x = 0;
    for(let i = 0; i < bufferLength; i++){
      const barHeight = data[i] * 0.65;
      ctx.fillStyle = `hsla(${(i * 5 + barHeight) % 360}, 100%, ${50 + barHeight / 5}%, 0.4)`;
      ctx.fillRect(x, h - barHeight, barWidth, barHeight);
      x += barWidth + 1;
    }
  },
  (ctx, data, w, h) => {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, w, h);
    let total = 0;
    for(let i = 0; i < bufferLength; i++) total += data[i];
    const avg = total / bufferLength / 255;
    const starCount = 80 + Math.floor(avg * 200);
    const time = Date.now() * 0.002;
    for(let i = 0; i < starCount; i++){
      const x = (i * 131.7 + time * 50) % w;
      const y = (i * 89.3 + time * 30) % h;
      const size = 1 + Math.sin(time * 5 + i) * avg * 4;
      const opacity = 0.4 + avg * 0.6;
      const hue = (i * 7 + time * 100) % 360;
      ctx.shadowBlur = 15 + avg * 25;
      ctx.shadowColor = `hsla(${hue}, 100%, 80%, ${opacity})`;
      ctx.fillStyle = `hsla(${hue}, 100%, 95%, ${opacity})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => {
      ctx.clearRect(0,0,w,h);
      const centerX = w / 2;
      const centerY = h / 2;
      const baseRadius = Math.min(centerX, centerY) * 0.1;
      const maxRadius = Math.min(centerX, centerY) * 1.5;
      for (let i = 0; i < bufferLength; i += 2) {
          const value = data[i];
          const radius = baseRadius + (maxRadius - baseRadius) * (value / 255);
          const hue = (i * 10) % 360;
          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.1)`;
          ctx.lineWidth = 2 + (value / 50);
          ctx.stroke();
      }
  },
  (ctx, data, w, h) => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, w, h);
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      const sliceWidth = w * 1.0 / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
          const value = data[i];
          const y = (value / 128.0) * (h / 4) + (h / 2);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
      }
      ctx.lineTo(canvas.width, canvas.height / 2);
      let total = 0;
      for(let i=0; i<bufferLength; i++) total += data[i];
      const avg = total / bufferLength;
      const hue = (avg * 2) % 360;
      ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 10;
      ctx.shadowColor = `hsla(${hue}, 100%, 50%, 0.5)`;
      ctx.stroke();
      ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, w, h);
      const centerX = w / 2;
      const centerY = h / 2;
      for(let i=0; i<bufferLength; i += 4) {
          const value = data[i];
          const angle = (i / bufferLength) * Math.PI * 2;
          const time = Date.now() * 0.001;
          const distance = 100 + value * (2 + Math.sin(time + i*0.1));
          const x = centerX + Math.cos(angle) * distance;
          const y = centerY + Math.sin(angle) * distance;
          const size = 2 + value / 20;
          const hue = (i * 15 + time * 50) % 360;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.6)`;
          ctx.shadowBlur = size * 2;
          ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.4)`;
          ctx.fill();
      }
      ctx.shadowBlur = 0;
  },
  (ctx, data, w, h) => { ctx.clearRect(0,0,w,h); }
];
let currentEffect = 3;
const effectNames = ["Bars", "★ Stars", "Circles", "Wave", "Particles", "OFF"];
function drawEqualizer(){
  requestAnimationFrame(drawEqualizer);
  if(!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  effects[currentEffect](ctx, dataArray, canvas.width, canvas.height);
}
effectBtn.addEventListener('click', () => {
  currentEffect = (currentEffect + 1) % effects.length;
  effectBtn.textContent = effectNames[currentEffect];
});
volumeSlider.addEventListener('input', () => {
  audio.volume = volumeSlider.value / 100;
  volumeValue.textContent = `${volumeSlider.value}%`;
});

function decodeGreek(str){
  try{
    const decoder = new TextDecoder('windows-1253');
    const bytes = new Uint8Array([...str].map(c => c.charCodeAt(0)));
    return decoder.decode(bytes);
  } catch(e){ return str; }
}
function updateUIWithTitle(titleText) {
  let finalTitle = titleText || originalRadioName;
  if (finalTitle.length > 20) {
    nowPlayingEl.innerHTML = `<span class="scroll-text">${finalTitle}</span>`;
  } else {
    nowPlayingEl.innerHTML = `<span class="static-text">${finalTitle}</span>`;
  }
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'RADIO_TITLE_UPDATE', title: finalTitle }, '*');
  }
}
async function fetchTitle() {
  if(isIntroActive) return;
  if (isLive) {
    const url = STREAMS.live.statusUrl;
    try {
      const r = await fetch(url + (url.includes('?') ? '&' : '?') + "t=" + Date.now());
      const data = await r.json();
      let title = "";
      if(data.icestats && data.icestats.source){
        const src = Array.isArray(data.icestats.source) ? data.icestats.source.find(s => s.listenurl && s.listenurl.includes("/trela233")) : data.icestats.source;
        title = src && src.title ? src.title : "";
      }
      if(title) title = decodeGreek(title);
      updateUIWithTitle(title);
    } catch(e) { updateUIWithTitle(originalRadioName); }
  } else {
    try {
      const r = await fetch(STREAMS.backup.statusUrl + "?t=" + Date.now());
      const data = await r.json();
      if(data && data.now_playing && data.now_playing.song) {
         updateUIWithTitle(data.now_playing.song.text);
      }
    } catch(e) { updateUIWithTitle(originalRadioName); }
  }
}
function startAutoRetry(){
  if(window._playerRetryInterval) return;
  window._playerRetryInterval = setInterval(async () => {
    if(!isPlaying || isIntroActive) return;
    if(!isLive){
      const test = new Audio(); test.crossOrigin = "anonymous"; test.src = STREAMS.live.streamUrl;
      try{
        await test.play(); test.pause(); test.src = "";
        playStream(STREAMS.live.streamUrl, true);
      } catch(e){}
    }
  }, retryIntervalMs);
}
async function playStream(url, live=true){
  isIntroActive = false;
  audio.pause(); audio.src = ""; isLive = live;
  modalText.textContent = live ? "Φόρτωση live streaming" : "Σύνδεση με Backup Server...";
  loadingModal.style.display = "flex";
  statusEl.textContent = live ? "Φόρτωση Live Streaming" : "Φόρτωση Backup...";
  statusEl.className = "loading";
  audio.src = url;
  try {
    await audio.play();
    loadingModal.style.display = "none";
    statusEl.textContent = live ? "ON AIR Radio Synnefa " : " ON AIR Radio Synnefa (Backup)";
    statusEl.className = live ? "onair" : "offair";
    setTimeout(() => { fetchTitle(); }, 2000);
  } catch(e){
    if(live) {
        console.log("Live stream failed, trying backup...");
        playStream(STREAMS.backup.streamUrl, false);
    } else {
        loadingModal.style.display = "none";
        statusEl.textContent = "Offline";
        statusEl.className = "offair";
    }
  }
}

/* ========== INTRO LOGIC ========== */
function resizeIntro() {
  const overlay = document.getElementById("startOverlay");
  const content = document.querySelector(".intro-content");
  if (!overlay || !content) return;
  content.style.setProperty("--intro-scale", "1");
  requestAnimationFrame(function () {
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const contentWidth = content.offsetWidth;
    const contentHeight = content.offsetHeight;
    if (!contentWidth || !contentHeight) return;
    const availableWidth = viewportWidth * 0.94;
    const availableHeight = viewportHeight * 0.88;
    const scaleByWidth = availableWidth / contentWidth;
    const scaleByHeight = availableHeight / contentHeight;
    const scale = Math.min(1, scaleByWidth, scaleByHeight);
    content.style.setProperty("--intro-scale", scale.toFixed(4));
  });
}

function closeIntro() {
  const startOverlay = document.getElementById("startOverlay");
  startOverlay.classList.add("hide");

  // Εμφάνισε τον κανονικό player
  document.getElementById('visualizerCircle').classList.remove('player-hidden');
  document.getElementById('playBtn').classList.remove('player-hidden');
  document.getElementById('status').classList.remove('player-hidden');
  document.getElementById('nowPlaying').classList.remove('player-hidden');
  document.getElementById('volumeControl').classList.remove('player-hidden');
  document.getElementById('effectBtn').classList.remove('player-hidden');
  document.getElementById('equalizer').classList.remove('player-hidden');

  setTimeout(function () {
    startOverlay.style.display = "none";
  }, 950);
}

function startIntroFromFancy() {
  if (hasIntroPlayed) return;
  hasIntroPlayed = true;
  isIntroActive = true;

  const startBtn = document.getElementById("startBtn");
  const introStatus = document.getElementById("introStatus");
  const introProgressWrapper = document.getElementById("introProgressWrapper");
  const skipIntroBtn = document.getElementById("skipIntroBtn");
  const introAudio = document.getElementById("introAudio");

  startBtn.style.display = "none";
  introStatus.style.display = "block";
  introStatus.textContent = "INTRO PLAYING";
  introProgressWrapper.style.display = "block";
  skipIntroBtn.style.display = "block";
  setTimeout(resizeIntro, 20);

  // setupAudioNodes() ΔΕΝ καλείται εδώ (για να μην βγαίνει η κόκκινη γραμμή)

  const playPromise = introAudio.play();
  if (playPromise !== undefined) {
    playPromise.catch(function (error) {
      console.error("Αποτυχία intro:", error);
      finishIntroAndStartLive();
    });
  }
}

function finishIntroAndStartLive() {
  const introAudio = document.getElementById("introAudio");
  introAudio.pause();
  introAudio.currentTime = 0;
  isIntroActive = false;
  closeIntro();
  
  setupAudioNodes();          // ξεκινάει τώρα το visualizer
  playStream(STREAMS.live.streamUrl, true);
  isPlaying = true;
  btn.textContent = "Pause";
  startAutoRetry();
}

document.addEventListener("DOMContentLoaded", function () {
  resizeIntro();
  window.addEventListener("resize", resizeIntro);
  window.addEventListener("orientationchange", function () { setTimeout(resizeIntro, 100); });

  const startBtn = document.getElementById("startBtn");
  const skipIntroBtn = document.getElementById("skipIntroBtn");
  const introAudio = document.getElementById("introAudio");
  const introStatus = document.getElementById("introStatus");
  const introProgress = document.getElementById("introProgress");
  const introProgressWrapper = document.getElementById("introProgressWrapper");

  startBtn.addEventListener("click", function () {
    startIntroFromFancy();
  });

  skipIntroBtn.addEventListener("click", function () {
    introStatus.textContent = "CONNECTING TO LIVE...";
    skipIntroBtn.style.display = "none";
    introProgressWrapper.style.display = "none";
    resizeIntro();
    setTimeout(finishIntroAndStartLive, 250);
  });

  introAudio.addEventListener("play", function () {
    introStatus.textContent = "INTRO PLAYING";
  });

  introAudio.addEventListener("timeupdate", function () {
    if (introAudio.duration && isFinite(introAudio.duration)) {
      const percentage = (introAudio.currentTime / introAudio.duration) * 100;
      introProgress.style.width = percentage + "%";
    }
  });

  introAudio.addEventListener("ended", function () {
    introProgress.style.width = "100%";
    introStatus.textContent = "CONNECTING TO LIVE...";
    skipIntroBtn.style.display = "none";
    introProgressWrapper.style.display = "none";
    resizeIntro();
    setTimeout(finishIntroAndStartLive, 450);
  });

  introAudio.addEventListener("error", function () {
    console.warn("Το intro δεν βρέθηκε. Εκκίνηση radio.");
    finishIntroAndStartLive();
  });
});

/* ========== ΥΠΟΛΟΙΠΟ PLAYER ========== */
let rotation = 0;
function rotateButton(){
  if(isPlaying){
    rotation += 0.2;
    visualizerCircle.style.transform = `scale(1.0) rotate(${rotation}deg)`;
  }
  requestAnimationFrame(rotateButton);
}
requestAnimationFrame(rotateButton);

btn.addEventListener('click', () => {
  if(isPlaying){
    audio.pause();
    btn.textContent = "Play";
    statusEl.textContent = "Παύση";
    statusEl.className = "offair";
    isPlaying = false;
    loadingModal.style.display = "none";
  } else {
    playStream(STREAMS.live.streamUrl, true);
    isPlaying = true;
    btn.textContent = "Pause";
    startAutoRetry();
  }
});

audio.addEventListener('error', () => {
  if(isIntroActive) finishIntroAndStartLive();
  else if(isLive) playStream(STREAMS.backup.streamUrl, false);
});
audio.addEventListener('ended', () => {
  if(isIntroActive) finishIntroAndStartLive();
  else if(isLive) playStream(STREAMS.backup.streamUrl, false);
});
setInterval(() => { if(isPlaying && !isIntroActive) fetchTitle(); }, 15000);

let _breathRunning = false;
let lastLevel = 0;
function startButtonBreath(){
  if(_breathRunning) return;
  _breathRunning = true;
  function step(){
    let boost = 0;
    let targetGlow = 0;
    let musicHue = 174;
    if(analyser && dataArray && isPlaying && !audio.paused && (effectNames[currentEffect] !== "OFF")){
        analyser.getByteFrequencyData(dataArray);
        let bassSum = 0;
        for (let i = 0; i < 10; i++) bassSum += dataArray[i];
        let averageBass = bassSum / 10;
        let colorOscillation = Math.sin(averageBass * 0.05) * 180 + 180;
        musicHue = Math.floor(174 + colorOscillation) % 360;
        let currentLevel = averageBass / 255;
        let delta = currentLevel - lastLevel;
        if (delta < 0) delta = 0;
        lastLevel = currentLevel;
        boost = Math.min(delta * 5, 0.4);
        targetGlow = Math.min(2.0, averageBass / 50);
        visualizerCircle.style.setProperty('--glow-size', Math.round(targetGlow * 130) + "px");
        visualizerCircle.style.setProperty('--glow-h', musicHue);
    } else {
        visualizerCircle.style.setProperty('--glow-size', "0px");
        visualizerCircle.style.setProperty('--glow-h', "174");
        boost = 0;
    }
    visualizerCircle.style.transform = `scale(${1 + boost}) rotate(${rotation}deg)`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
</script>
